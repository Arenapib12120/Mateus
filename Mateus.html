<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prazo do Mateus Renan (Firebase)</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2a24;--mut:#6b7a72;--ac:#1f8a5b;--ac2:#e8f5ee;--bd:#e2ded4;--red:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a16;--card:#1b2620;--tx:#e8efe9;--mut:#93a39a;--ac:#4cc58b;--ac2:#1e3a2c;--bd:#2c3d33}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{width:100%;margin-top:16px;padding:14px;font-size:16px;font-weight:600;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:var(--ac2);color:var(--ac)}
#lista p{margin:0 0 10px;padding:10px 12px;background:var(--ac2);border-radius:10px;word-break:break-word}
#st{font-size:13px;color:var(--mut);margin-top:8px}
.err{color:var(--red)}
</style>
</head>
<body>
<div class="w">
  <h1>Prazo do Mateus Renan</h1>
  <p class="sub" id="sub">Somente leitura. Entre com a senha para editar.</p>

  <div class="card">
    <label>Prazo</label>
    <div id="prazoTxt" style="font-size:18px;font-weight:600">—</div>
    <div id="editor" hidden>
      <label for="prazo">Alterar prazo</label>
      <input id="prazo" type="text" placeholder="Ex: 30/11/2026">
      <button id="salvar">Salvar</button>
    </div>
  </div>

  <div class="card" id="loginCard">
    <label for="senha">Senha</label>
    <input id="senha" type="password" placeholder="Senha para editar" autocomplete="current-password">
    <button id="entrar" class="sec">Entrar</button>
    <button id="sair" class="sec" hidden>Sair</button>
    <div id="st"></div>
  </div>

  <div class="card">
    <label for="msg">Mensagem</label>
    <input id="msg" type="text" placeholder="Digite sua mensagem" maxlength="500">
    <button id="enviar">Enviar</button>
    <div id="lista" style="margin-top:16px"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// COLE AQUI o firebaseConfig do seu projeto
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
  appId: "SEU_APP_ID"
};
// E-mail do usuário criado em Authentication > Users
const EMAIL_ADMIN = "mateus@seusite.com";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const $ = id => document.getElementById(id);

// ---- Login ----
$("entrar").onclick = async () => {
  $("st").textContent = ""; $("st").className = "";
  try { await signInWithEmailAndPassword(auth, EMAIL_ADMIN, $("senha").value); $("senha").value = ""; }
  catch { $("st").textContent = "Senha incorreta."; $("st").className = "err"; }
};
$("sair").onclick = () => signOut(auth);
onAuthStateChanged(auth, u => {
  const on = !!u;
  $("editor").hidden = !on;
  $("sair").hidden = !on;
  $("entrar").hidden = on;
  $("senha").hidden = on;
  document.querySelector('label[for="senha"]').hidden = on;
  $("sub").textContent = on ? "Modo edição ativo." : "Somente leitura. Entre com a senha para editar.";
});

// ---- Prazo (só quem tem senha altera) ----
const prazoRef = doc(db, "config", "prazo");
onSnapshot(prazoRef, s => {
  const v = s.exists() ? s.data().valor : "—";
  $("prazoTxt").textContent = v;
  if (document.activeElement !== $("prazo")) $("prazo").value = s.exists() ? v : "";
});
$("salvar").onclick = async () => {
  try { await setDoc(prazoRef, { valor: $("prazo").value.trim() }); $("st").textContent = "Salvo."; $("st").className = ""; }
  catch { $("st").textContent = "Sem permissão."; $("st").className = "err"; }
};

// ---- Mensagens ----
const msgs = collection(db, "mensagens");
$("enviar").onclick = async () => {
  const el = $("msg");
  const texto = el.value.trim();
  if (!texto) return;
  try { await addDoc(msgs, { texto, criado: serverTimestamp() }); el.value = ""; }
  catch { alert("Não foi possível enviar."); }
};
onSnapshot(query(msgs, orderBy("criado", "desc")), snap => {
  const lista = $("lista");
  lista.innerHTML = "";
  snap.forEach(d => {
    const p = document.createElement("p");
    p.textContent = d.data().texto;
    lista.appendChild(p);
  });
});
</script>
</body>
</html>
